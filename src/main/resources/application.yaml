spring:
  application:
    name: smart-task-management
  datasource:
    url : jdbc:postgresql://localhost:5432/smart_tasks
    username : admin
    password : admin
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8082
